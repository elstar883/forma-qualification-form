<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORMA — анкета для будущего проекта</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="brand">FORMA</header>

    <main>
      <!-- Начальное состояние (ТЗ §10) -->
      <section id="screen-welcome" class="screen is-active">
        <p class="lead" id="welcome-text"></p>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-start" type="button">Начать</button>
        </div>
      </section>

      <!-- Восстановленный черновик (ТЗ §10; активируется в итерации 3, FR-09) -->
      <section id="screen-draft" class="screen">
        <h1 class="screen-title" id="draft-title"></h1>
        <div class="actions">
          <button class="btn btn--primary" id="btn-continue" type="button">Продолжить</button>
          <button class="btn btn--secondary" id="btn-restart" type="button">Начать заново</button>
        </div>
      </section>

      <!-- Заполнение: прогресс + шаг + навигация (FR-01, FR-03) -->
      <section id="screen-form" class="screen">
        <p class="progress" id="progress" aria-live="polite"></p>
        <div id="step-container"></div>
        <div class="actions">
          <button class="btn btn--secondary" id="btn-prev" type="button">Назад</button>
          <button class="btn btn--primary" id="btn-next" type="button">Дальше</button>
        </div>
      </section>

      <!-- Проверка ответов (FR-04) -->
      <section id="screen-review" class="screen">
        <h1 class="screen-title" id="review-title"></h1>
        <p class="screen-subtitle" id="review-subtitle"></p>
        <div id="review-list"></div>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-submit" type="button">Отправить</button>
        </div>
      </section>

      <!-- Успешное завершение (FR-05) -->
      <section id="screen-thanks" class="screen">
        <p class="thanks" id="thanks-text"></p>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-open-card" type="button">Карточка для менеджера</button>
        </div>
      </section>

      <!-- Экран менеджера (FR-06): блок статуса (FR-07), копирование (FR-08) -->
      <section id="screen-card" class="screen">
        <h1 class="screen-title" id="card-title"></h1>
        <div id="card-status"></div>
        <div id="card-list" class="card-list"></div>
        <div class="actions">
          <button class="btn btn--primary btn--block" id="btn-copy" type="button"></button>
          <button class="btn btn--secondary btn--block" id="btn-new-form" type="button">Новая анкета</button>
        </div>
        <p class="copy-status" id="copy-status" aria-live="polite" hidden></p>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/qualification.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
